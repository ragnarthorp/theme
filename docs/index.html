<body>
<main>
  <header>
    <h1>Neyðarkall frá Andesfjöllum</h1>
  </header>

  <figure class="hero">
    <picture>
      <source srcset="ernesto.webp" type="image/webp">
      <img src="ernesto.jpg" width="1344" height="896"
           alt="Ernesto, gamall bóndi með hatt, hvítt skegg og poncho, situr á steini við grænbláa á. Í baksýn eru brött fjöll, hrunin steinbrú og gamalt þorp á klettabrún.">
    </picture>
  </figure>

  <section class="audio" aria-labelledby="hlusta">
    <h2 id="hlusta">Hlustaðu á Ernesto</h2>
    <audio controls preload="metadata" src="saga.mp3">
      Vafrinn þinn getur ekki spilað hljóðið. <a href="saga.mp3">Sæktu það hér.</a>
    </audio>
  </section>

  <section class="puzzle" aria-labelledby="thraut">
    <h2 id="thraut">Hvað heitir þorpið?</h2>
    <p class="hint">Raðaðu stöfunum í rétta röð. Pikkaðu á staf til að setja hann í næsta lausa hólf og á staf í hólfi til að taka hann aftur.</p>

    <div class="slots" id="slots" role="group" aria-label="Hólf fyrir svarið"></div>
    <div class="bank" id="bank" role="group" aria-label="Stafir til að raða"></div>

    <div class="actions">
      <button type="button" class="reset" id="reset">Byrja aftur</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="task" id="task" hidden tabindex="-1" aria-label="Verkefnið"></section>
</main>
